# Model configuration - v2: larger TCN only, conservative label training
model:
  encoder_model: "mert"
  encoder_frozen: true
  encoder_lr: 1e-5
  boundary_head_type: "tcn"
  boundary_hidden_dim: 256
  boundary_num_layers: 6        # was 4 → larger receptive field (WORKS)
  boundary_dropout: 0.1
  boundary_kernel_size: 15      # was 3 → section-level context (WORKS)
  boundary_dilation_base: 3     # was 2 → wider (WORKS)
  transformer_num_heads: 8
  transformer_num_layers: 2
  label_hidden_dim: 128
  num_labels: 8
  boundary_loss_weight: 1.0
  label_loss_weight: 1.0        # back to 1.0
  focal_gamma: 2.0
  label_focal_gamma: 0.0        # disabled
  label_smoothing: 0.0          # disabled
  learning_rate: 0.0002
  weight_decay: 0.01
  embedding_dim: 768

# Data settings
data_dir: "data/processed"
batch_size: 4
max_epochs: 150
num_workers: 4

# Training settings
learning_rate: 0.0002
weight_decay: 0.01
gradient_clip_val: 1.0

# Augmentation DISABLED for debugging
augmentation:
  enabled: false

# Class weighting DISABLED for debugging
use_class_weights: false

# Validation settings
val_check_interval: 0.25
early_stopping_patience: 25

# Logging settings
use_wandb: false
project_name: "mertalizer"
experiment_name: "mert-95m-tcn-v2-debug"

# Checkpoint settings
checkpoint_dir: "models/checkpoints"
save_top_k: 3

# Audio settings
target_sr: 22050
max_audio_length: 600.0
